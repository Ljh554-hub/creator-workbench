<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1E3A5F" />
<title>创作工作台 Self-Media Studio</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="创作工作台" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<style>
:root{
  /* 莫兰迪基础色系 — 低饱和、灰调柔和 */
  --sb:#6B6678; --sb-active:#524D5D; --sb-text:#E8E4E0;
  --bg:#F0EDE8; --card:#FAF8F5; --card2:#EAE6DF; --line:#DDD9D3;
  --dark:#4A4642; --muted:#9B9590; --danger:#C4786A;
  --accent:#8FA4B5; --accent2:#A8BCC9; --accent-warm:#BC9488;
  --shadow:0 6px 18px rgba(74,70,66,.10); --radius:14px;
}
/* 莫兰迪导航配色主题（侧栏 + 强调色） */
body.nav-morandi-rose{--sb:#7B6869;--sb-active:#5E5051;--accent:#B09398;--accent2:#C4ADB2;}
body.nav-morandi-sage{--sb:#6B7560;--sb-active:#525A45;--accent:#96A885;--accent2:#AFBE9F;}
body.nav-morandi-bluegray{--sb:#5A6B78;--sb-active:#46525C;--accent:#8FA4B5;--accent2:#A8BCC9;}
body.nav-morandi-lavender{--sb:#6B6678;--sb-active:#524D5D;--accent:#9E99AD;--accent2:#B5B0C4;}
body.nav-morandi-taupe{--sb:#6E665E;--sb-active:#554E48;--accent:#A39890;--accent2:#BBB0A8;}
body.nav-morandi-coral{--sb:#7A655E;--sb-active:#5E4D47;--accent:#BC9488;--accent2:#CEADA2;}
body.nav-morandi-teal{--sb:#5A706E;--sb-active:#465857;--accent:#8BA8A5;--accent2:#A5C0BD;}
body.nav-morandi-plum{--sb:#6E6070;--sb-active:#554A57;--accent:#A08E9E;--accent2:#B8A8B6;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--dark);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--dark);}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:#d8d2c8;border-radius:6px;}

/* ===== 布局 ===== */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:220px;flex:0 0 220px;background:var(--sb);color:var(--sb-text);
  padding:18px 10px 14px;position:fixed;left:0;top:0;bottom:0;overflow-y:auto;z-index:50;transition:transform .25s;
}
.brand{text-align:center;padding:0 6px 14px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px;}
.brand .star{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#FFD56B,#E76F51);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;}
.brand .t{font-size:12px;font-weight:600;color:#fff;}
.brand .sub{font-size:9px;opacity:.7;margin-top:2px;}
.av-prev{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#FFD56B,#E76F51);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;overflow:hidden;flex:0 0 42px;}
#nav{margin-top:6px;}
.nav-item{
  display:flex;align-items:center;gap:8px;
  padding:9px 10px;margin:3px 4px;border-radius:10px;
  font-size:12px;cursor:pointer;transition:background .18s;position:relative;
}
.nav-item .ico{font-size:17px;flex:0 0 auto;}
.nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-item:hover{background:rgba(255,255,255,.06);}
.nav-item.active{background:var(--sb-active);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--accent2);}
.nav-item .ed{display:none;gap:2px;}
.nav-edit .nav-item .ed{display:flex;}
.nav-item .ed button{width:20px;height:20px;border-radius:5px;background:rgba(255,255,255,.12);font-size:11px;display:flex;align-items:center;justify-content:center;}
.nav-item .ed button:hover{background:rgba(255,255,255,.25);}
.nav-item.home .ed{display:none!important;}

.sb-foot{padding:12px 8px 4px;border-top:1px solid rgba(255,255,255,.08);margin-top:8px;display:flex;flex-direction:column;gap:7px;}
.sb-foot button{background:rgba(255,255,255,.08);color:#fff;padding:7px 10px;border-radius:8px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}
.sb-foot button:hover{background:rgba(255,255,255,.18);}
.sb-foot .add-mod{background:var(--accent);}
.sb-foot .date{font-size:10px;text-align:center;color:rgba(255,255,255,.5);margin-top:2px;}
.sb-edit-toggle{position:absolute;top:20px;right:12px;font-size:11px;color:rgba(255,255,255,.7);background:rgba(255,255,255,.1);padding:3px 7px;border-radius:6px;}
.sb-edit-toggle.on{background:var(--accent);color:#fff;}

.main{margin-left:220px;flex:1;padding:20px 24px 60px;min-width:0;}
.module-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px;padding:12px 4px;position:sticky;top:0;z-index:20;background:var(--bg);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);}
.module-head .left{display:flex;align-items:center;gap:9px;min-width:0;}
.module-head .hamb{display:none;font-size:20px;background:var(--card);border:1px solid var(--line);width:38px;height:38px;border-radius:9px;align-items:center;justify-content:center;box-shadow:var(--shadow);}
.module-head .name{font-size:20px;font-weight:700;color:var(--dark);display:flex;align-items:center;gap:8px;}
.module-head .name .ico{font-size:22px;}
.module-head .acts{display:flex;gap:7px;flex-wrap:wrap;}
.module-head .acts button{background:var(--card);color:var(--dark);padding:7px 12px;border-radius:8px;font-size:12px;border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;gap:4px;box-shadow:var(--shadow);transition:background .18s;}
.module-head .acts button:hover{background:var(--card2);}
.module-head .acts button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ===== 首页仪表盘 ===== */
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
.home-chip{background:var(--card);border-radius:12px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;gap:10px;transition:transform .15s,border-color .15s;}
.home-chip:hover{transform:translateY(-2px);border-color:var(--accent2);}
.home-chip .ic{font-size:24px;}
.home-chip .tx{font-size:13px;font-weight:600;}
.home-chip .ct{font-size:10px;color:var(--muted);margin-top:2px;}
.panel{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px;}
.panel .ph{font-size:14px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:7px;}
.mini-link{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:5px 12px;font-size:12px;margin:4px 4px 0 0;cursor:pointer;color:var(--dark);}
.mini-link:hover{border-color:var(--accent2);}
.mini-link .x{color:var(--accent-warm);margin-left:2px;}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;}
.switch .track{width:42px;height:24px;border-radius:14px;background:var(--card2);border:1px solid var(--line);position:relative;transition:background .2s;}
.switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch.on .track{background:var(--accent);}
.switch.on .knob{left:20px;}
.empty{text-align:center;color:var(--muted);padding:24px;font-size:13px;}
.empty button{margin-top:8px;}

/* ===== 子标签 + 顶部外链 ===== */
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;}
.cat-tab{flex:0 0 auto;padding:6px 14px;border-radius:18px;background:var(--card2);font-size:12px;cursor:pointer;color:var(--dark);border:1px solid var(--line);white-space:nowrap;}
.cat-tab.on{background:var(--accent);color:#fff;font-weight:600;border-color:var(--accent);}
.top-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.top-link{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border-radius:9px;padding:6px 12px;font-size:12px;cursor:pointer;box-shadow:var(--shadow);}
.top-link:hover{opacity:.92;}
.list-tool{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.search-input{flex:1;min-width:200px;}

/* ===== 卡片 ===== */
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
.video-card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;transition:transform .15s;display:flex;flex-direction:column;}
.video-card:hover{transform:translateY(-3px);}
.video-card .thumb{position:relative;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;}
.video-card .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.video-card .play::before{content:"▶";width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;}
.video-card .dur{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 7px;border-radius:5px;}
.video-card .plat{position:absolute;top:8px;right:8px;font-size:10px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.9);color:var(--dark);font-weight:600;}
.video-card .body{padding:9px 11px;flex:1;display:flex;flex-direction:column;}
.video-card .body .t{font-size:13px;font-weight:600;line-height:1.4;}
.video-card .body .a{font-size:11px;color:var(--muted);margin-top:3px;}
.video-card .body .note{font-size:11px;color:var(--accent);margin-top:5px;line-height:1.4;}
.video-card .body .meta{margin-top:auto;padding-top:7px;display:flex;gap:6px;}
.video-card .body .meta button{font-size:11px;padding:3px 8px;border-radius:7px;background:var(--card2);color:var(--dark);}
.video-card .ext-pill{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:6px;}

/* 卡片渐变（rainbow / 指定） */
.g-blue{background:linear-gradient(135deg,#4A90D9,#6FA8DC);}
.g-teal{background:linear-gradient(135deg,#2EB6A6,#5BCBB3);}
.g-purple{background:linear-gradient(135deg,#9B8CFF,#B9AEE8);}
.g-orange{background:linear-gradient(135deg,#E76F51,#F0A07A);}
.g-pink{background:linear-gradient(135deg,#E58FB0,#F2B6CE);}
.g-green{background:linear-gradient(135deg,#5BBA8A,#7BB198);}
/* 莫兰迪卡片配色主题 */
body.cards-morandi-warm .video-card .thumb{background:linear-gradient(135deg,#BC9488,#CEADA2)!important;}
body.cards-morandi-cool .video-card .thumb{background:linear-gradient(135deg,#8FA4B5,#A8BCC9)!important;}
body.cards-morandi-neutral .video-card .thumb{background:linear-gradient(135deg,#A39890,#BBB0A8)!important;}
body.cards-morandi-rose .video-card .thumb{background:linear-gradient(135deg,#B09398,#C4ADB2)!important;}
body.cards-morandi-sage .video-card .thumb{background:linear-gradient(135deg,#96A885,#AFBE9F)!important;}
body.cards-morandi-ocean .video-card .thumb{background:linear-gradient(135deg,#8BA8A5,#A5C0BD)!important;}

/* ===== 通用元素 / 弹窗 ===== */
.btn{background:var(--accent);color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;}
.btn.sm{padding:5px 11px;font-size:12px;}
.btn.soft{background:var(--card2);color:var(--dark);}
.btn.danger{background:#E05A4F;color:#fff;}
.input,.textarea,.select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;}
.textarea{resize:vertical;min-height:60px;}
.field{margin-bottom:11px;}
.label{font-size:11px;color:var(--muted);margin-bottom:4px;display:block;}
.row{display:flex;gap:8px;}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal-mask.show{display:flex;}
.modal{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;}
.modal h2{margin:0 0 14px;font-size:17px;}
.modal-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;}
.seg{display:flex;gap:6px;flex-wrap:wrap;}
.seg button{padding:6px 12px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:12px;cursor:pointer;}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;}
.overlay.show{display:block;}

@media(min-width:1280px){.video-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));}}
@media(min-width:1600px){.video-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}}
@media(max-width:760px){
  .sidebar{transform:translateX(-100%);width:248px;flex:0 0 248px;box-shadow:6px 0 24px rgba(0,0,0,.25);}
  .sidebar.open{transform:none;}
  .main{margin-left:0;padding:14px 12px 60px;}
  .module-head .hamb{display:flex;}
  .module-head .name{font-size:17px;}
  .module-head .acts button{padding:8px 10px;font-size:12px;}
  .video-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .home-grid{grid-template-columns:repeat(2,1fr);}
  .sb-edit-toggle{top:14px;right:10px;}
}

/* ===== 减肥运动专属 ===== */
.mh-sub{font-size:12px;color:var(--muted);background:var(--card2);padding:3px 9px;border-radius:8px;margin-left:2px;}
.wseg-bar{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;}
.wseg{flex:0 0 auto;padding:7px 15px;border-radius:20px;background:var(--card2);font-size:13px;cursor:pointer;border:1px solid var(--line);white-space:nowrap;color:var(--dark);}
.wseg.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
.selbar{display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;padding:9px 14px;border-radius:10px;margin-bottom:12px;font-size:13px;}
.selbar .acts{margin-left:auto;display:flex;gap:8px;}
.selbar .btn.soft{background:rgba(255,255,255,.25);color:#fff;}
.video-card.sel{cursor:pointer;}
.video-card .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.sel-box{position:absolute;right:8px;bottom:8px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;border:2px solid #fff;z-index:2;}
.sel-box.on{background:var(--accent);}
.wform{max-width:760px;}
.cchk-wrap{display:flex;flex-direction:column;gap:10px;background:var(--card2);padding:10px;border-radius:10px;}.wtab-grp{background:#fff;border-radius:8px;padding:8px 10px;border:1px solid var(--line);}
.wtab-grp-hd{font-size:12px;font-weight:600;color:var(--accent);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed var(--line);}
.wtab-grp-hd span{color:var(--muted);font-weight:400;}
.cchk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:3px 0;}
.cchk-t{flex:1;min-width:0;}
.cchk-d{color:var(--accent);font-size:11px;background:var(--card2);padding:1px 6px;border-radius:6px;}
.muted-mini{font-size:12px;color:var(--muted);padding:3px 0;}
.sumbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;background:#fff;border-radius:8px;padding:8px;border:1px solid var(--line);}
.sum-it{display:flex;flex-direction:column;align-items:center;gap:2px;}
.sum-it .k{font-size:11px;color:var(--muted);}
.sum-it .v{font-size:14px;font-weight:600;color:var(--accent);}
.meas-cell{display:flex;flex-wrap:wrap;gap:3px 8px;font-size:11px;}
.meas-cell span{background:var(--card2);padding:1px 6px;border-radius:5px;}
.meas-delta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.md-it{display:flex;align-items:center;gap:5px;font-size:12px;padding:4px 8px;border:1px solid;border-radius:16px;background:#fff;}
.md-it i{width:8px;height:8px;border-radius:50%;display:inline-block;}
.hint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5;}
.seg-btn{padding:5px 11px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:12px;cursor:pointer;}
.seg-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.ledger{width:100%;border-collapse:collapse;font-size:12.5px;}
.ledger th,.ledger td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;}
.ledger th{background:var(--card2);font-weight:600;white-space:nowrap;}
.ledger tr:nth-child(even) td{background:#fafafa;}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px;}
.stat-card{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border-radius:12px;padding:14px;box-shadow:var(--shadow);}
.stat-card .v{font-size:24px;font-weight:700;}
.stat-card .l{font-size:12px;opacity:.9;margin-top:2px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.subpanel{background:var(--card2);border-radius:12px;padding:14px;}
.ph2{font-size:13px;font-weight:600;margin:0 0 10px;}
.barchart{display:flex;flex-direction:column;gap:8px;}
.barow{display:flex;align-items:center;gap:8px;font-size:12px;}
.bl{width:64px;flex:0 0 64px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btrack{flex:1;height:14px;background:#fff;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
.bfill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:8px;}
.bv{width:54px;flex:0 0 54px;text-align:right;color:var(--dark);}
.legend{display:flex;flex-direction:column;gap:4px;font-size:12px;}
.lg{display:flex;align-items:center;gap:6px;color:var(--dark);}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block;}
@media(max-width:760px){.grid2{grid-template-columns:1fr;}.cchk-wrap{flex-direction:column;}.sumbar{grid-template-columns:1fr;}}
/* ===== 常练组合（routines） ===== */
.routine-list{display:flex;flex-direction:column;gap:12px;}
.routine-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);}
.rc-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.rc-name{font-size:15px;font-weight:600;color:var(--dark);}
.rc-meta{font-size:12px;color:var(--muted);}
.rc-courses{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 12px;}
.rc-courses .muted-mini{font-size:12px;color:var(--muted);}
.rc-acts{display:flex;gap:8px;flex-wrap:wrap;}
.rp-pick{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;padding:2px 0;}
/* —— 英语学习：每日打卡 / 统计 —— */
.study-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--card2);border-radius:9px;}
.study-item .it-name{font-size:13px;font-weight:600;min-width:54px;color:var(--dark);}
.study-item .it-dur{flex:1;}
.study-item input[type=number]{max-width:110px;}
/* —— 笔记模块 —— */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:12px;}
.note-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:8px;}
.note-card:hover{transform:translateY(-2px);border-color:var(--accent);}
.note-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;position:relative;}

/* 读书推荐数据：用基于书名的豆瓣搜索链接覆盖硬编码 subject ID（原 ID 部分已失效） */
(FEED_POOL.books||[]).forEach(b=>{ b.url=bookSearchUrl(b.title); });
/* 数据源：默认使用仓库每日自动化写入的 autofeed（GitHub Actions 每天 09:00 重写 main 分支），所有设备一致；为空则用内置每日推荐 */
let feedSourceUrl=LS.get('feedSourceUrl','');
const FEED_REPO_BASE='https://raw.githubusercontent.com/Ljh554-hub/creator-workbench/main/autofeed/';
const FEED_OLD_GIST='https://gist.githubusercontent.com/Ljh554-hub/cbaf0b06d4c393f87b7fade396c33661/raw/';
/* 自动迁移：若仍指向旧 Gist，则切到仓库 raw 源，使已部署实例下次刷新即生效 */
if(!feedSourceUrl || feedSourceUrl===FEED_OLD_GIST){ feedSourceUrl=FEED_REPO_BASE; LS.set('feedSourceUrl',feedSourceUrl); }
function getFeedUrl(id){
  if(feedSourceUrl) return feedSourceUrl.trim().replace(/\/$/,'')+'/'+id+'.json?t='+Date.now();
  return 'autofeed/'+id+'.json?t='+Date.now();
}
/* 按日期种子做确定性伪随机，保证同一天各设备选出完全相同的条目 */
function seededPick(arr,n,seedStr){
  let seed=0; for(let i=0;i<seedStr.length;i++) seed=(seed*31+seedStr.charCodeAt(i))>>>0;
  const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; }
  return a.slice(0,n);
}
function hasFeed(id){ return FEED_IDS.includes(id); }
/* 读书推荐：基于书名生成豆瓣搜索链接，规避硬编码 subject ID 错位（如「何以中国」原 ID 已失效） */
function bookSearchUrl(title){ return 'https://book.douban.com/subject_search?search_text='+encodeURIComponent((title||'').trim()); }
/* 判断是否需要自动刷新（每天9点后首次加载时刷新） */
function needAutoRefresh(id){
  const today=todayStr();
  if(feedLastRefresh[id]===today) return false;
  const now=new Date();
  return now.getHours()>=9;
}
function loadAutofeed(id, elId, force){
  const el=document.getElementById(elId); if(!el) return;
  const btn=document.getElementById('feedRefreshBtn_'+id);
  if(btn){ btn.classList.add('spin'); btn.textContent='刷新中…'; }
  el.innerHTML='<div class="feed-loading">📡 正在拉取今日精选…</div>';
  const url=getFeedUrl(id);
  fetch(url,{cache:'no-store',mode:'cors'})
    .then(r=>{ if(!r.ok) throw new Error('no feed('+r.status+')'); return r.json(); })
    .then(d=>{
      const items=(d&&d.items)||[];
      const feedDate=d.date||'';
      if(feedDate===todayStr()){
        /* 远程/本地源当天内容：采用（编辑精选，跨设备一致） */
        d.items=items.slice(0,FEED_LIMIT);
        feedCache[id]=d.items; feedLastRefresh[id]=todayStr(); LS.set('feedLastRefresh',feedLastRefresh);
        el.innerHTML=renderFeed(d,id,true,false);
      } else {
        /* 数据源过期（无人每日重写）：改用按日期种子本地生成的“今日推荐”，保证每天新鲜且各设备一致 */
        const fb=generateFallbackFeed(id);
        feedCache[id]=fb;
        el.innerHTML=renderFeed({date:todayStr(),items:fb}, id, true, true);
      }
      if(btn){ btn.classList.remove('spin'); btn.textContent='🔄 刷新'; }
    })
    .catch(err=>{
      console.warn('[autofeed] fetch failed, use local daily pool:', err.message);
      const fb=generateFallbackFeed(id);
      feedCache[id]=fb;
      el.innerHTML=renderFeed({date:todayStr(),items:fb}, id, true, true);
      if(btn){ btn.classList.remove('spin'); btn.textContent='🔄 刷新'; }
    });
}
/* 兜底：从内置内容池按“日期种子”确定性生成今日精选（每天不同、各设备一致） */
function generateFallbackFeed(id){
  const pool=FEED_POOL[id]||[];
  if(!pool.length) return [];
  const items=seededPick(pool,FEED_LIMIT,todayStr());
  return items.map(it=>({...it}));
}
function yesterdayStr(){
  const d=new Date(); d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function renderFeed(d, id, isFresh, isFallback){
  const items=(d&&d.items)||[];
  if(!items.length) return `<div class="feed-loading muted">今日精选为空（可手动刷新或添加卡片后自动推荐）</div>`;
  const statusBadge=isFallback?'<span class="feed-badge" style="background:var(--muted)">每日推荐</span>'
    :!isFresh?'<span class="feed-badge" style="background:#D4A853">缓存</span>'
    :`<span class="feed-badge">${items.length} 条</span>`;
  const head=`<div class="feed-head">
      <span class="feed-title">📡 每日精选</span>
      <span class="feed-date">${esc(d.date||'')} · ${isFallback?'每日自动推荐':'每天 9:00 自动更新'}</span>
      ${statusBadge}
      <button class="fi-refresh" id="feedRefreshBtn_${id}" onclick="loadAutofeed('${id}','feedPanel',true)">🔄 刷新</button>
    </div>`;
  const list=items.map((it,i)=>`<div class="feed-item">${feedItemInner(id,it,i)}</div>`).join('');
  return head+list;
}
function feedItemInner(id, it, i){
  let title=esc(it.title||''), meta='', body='';
  const u=(id==='books'&&it.title)?bookSearchUrl(it.title):(it.url||'');
  /* 标题可点击跳转链接 */
  const titleHtml=u?'<a class="fi-title" href="'+esc(u)+'" target="_blank" rel="noopener">'+title+' ↗</a>':'<span class="fi-title">'+title+'</span>';
  if(id==='podcast'){
    meta=[it.author,it.platform,it.tag].filter(Boolean).map(esc).join(' · ');
    body=it.reason?'<div class="fi-body">'+esc(it.reason)+'</div>':'';
  }else if(id==='express'){
    meta=it.scenario?esc(it.scenario):'';
    body=[it.text?'<div class="fi-body">'+esc(it.text)+'</div>':'', it.tip?'<div class="fi-tip">💡 '+esc(it.tip)+'</div>':''].join('');
  }else if(id==='books'){
    meta=[it.author,it.source,it.cat].filter(Boolean).map(esc).join(' · ');
    body=it.reason?'<div class="fi-body">'+esc(it.reason)+'</div>':'';
  }
  const acts='<div class="fi-acts">'
      +'<button class="btn primary sm" onclick="viewFeedDetail(\''+id+'\','+i+')">📖 查看详情</button>'
      +(u?'<button class="btn soft sm" onclick="openExt(\''+esc(u)+'\')">🔗 打开</button>':'')
      +'<button class="btn soft sm" onclick="collectFeed(\''+id+'\','+i+')">＋ 收藏</button>'
    +'</div>';
  return '<div>'+titleHtml+'</div>'+(meta?'<div class="fi-meta">'+meta+'</div>':'')+body+acts;
}
/* 查看精选完整内容弹窗 */
function viewFeedDetail(id, idx){
  const it=(feedCache[id]||[])[idx]; if(!it) return;

      +(it.reason?'<div class="fd-section"><div class="fd-label">推荐理由</div><div class="fd-content">'+esc(it.reason)+'</div></div>':'');
  }else if(id==='express'){

      +(it.tip?'<div class="fd-section"><div class="fd-label">练习提示</div><div class="fd-content fi-tip">💡 '+esc(it.tip)+'</div></div>':'');
  }else{
    detailHtml='<div class="fd-row"><span class="fd-label">作者</span><span>'+esc(it.author||'-')+'</span></div>'
      +'<div class="fd-row"><span class="fd-label">来源</span><span>'+esc(it.source||'-')+'</span></div>'
      +(it.cat?'<div class="fd-row"><span class="fd-label">分类</span><span><span class="ntag">'+esc(it.cat)+'</span></span></div>':'')
      +(it.reason?'<div class="fd-section"><div class="fd-label">推荐理由</div><div class="fd-content">'+esc(it.reason)+'</div></div>':'');
  }
  const linkRow=u?'<div class="fd-row"><span class="fd-label">链接</span><a href="'+esc(u)+'" target="_blank" rel="noopener" style="color:var(--accent);word-break:break-all">'+esc(u)+'</a></div>':'';
  openModal('📖 精选详情', '<div class="feed-detail">'+detailHtml+linkRow+'</div>'

function collectFeed(id, i){
  const it=(feedCache[id]||[])[i]; if(!it) return;
  const m=state.modules.find(x=>x.id===id); if(!m) return;
  m.cards=m.cards||[];
  const grad=GRADS[m.cards.length%GRADS.length];
  let card;
  if(id==='podcast'){
    card={id:uid(),tab:'t1',title:it.title||'精选播客',author:it.author||'',dur:it.dur||'',platform:it.platform||'网页',url:it.url||'',grad,note:it.reason||''};
  }else if(id==='express'){
    card={id:uid(),tab:'t1',title:it.title||((it.scenario||'')+'练嘴素材'),author:it.scenario||'',dur:'',platform:'网页',url:it.url||'',grad,note:((it.text||'')+(it.tip?'\n\n💡 '+(it.tip):''))};
  }else{ // books
    card={id:uid(),tab:'t1',title:it.title||'精选好书',author:it.author||'',dur:'',platform:'网页',url:bookSearchUrl(it.title),grad,note:it.reason||''};

function saveQuote(){
  const m=getBooks();
  const book=$('#qBook').value.trim()||'未命名书';
  const author=$('#qAuthor').value.trim();
  const date=$('#qDate').value||todayStr();
  let cat=$('#qCat').value; if(cat==='__new__') cat=m.quoteCats[0]||'';
  if(!m.quoteCats.includes(cat)) m.quoteCats.push(cat);
  const quote=$('#qQuote').value, insight=$('#qInsight').value, note=$('#qNote').value, link=$('#qLink').value.trim();
  if(!quote.trim() && !insight.trim() && !note.trim()){ if(!confirm('三项内容都还是空的，仍要保存吗？')) return; }
  if(qEditId){ const q=m.quotes.find(x=>x.id===qEditId); if(q){ q.book=book;q.author=author;q.date=date;q.cat=cat;q.quote=quote;q.insight=insight;q.note=note;q.link=link; } }
  else { m.quotes.unshift({id:uid(),book,author,date,cat,quote,insight,note,link}); }
  save(); closeM(); renderModule();
}

/* —— 数据统计 —— */
function fmtDate(d){ const y=d.getFullYear(); const mo=String(d.getMonth()+1).padStart(2,'0'); const da=String(d.getDate()).padStart(2,'0'); return `${y}-${mo}-${da}`; }
function todayStr(){ return fmtDate(new Date()); }
function fmtDateTime(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function wStats(m){
  const recs=m.checkins;
  const today=new Date();
  // 连续打卡
  let streak=0; let d=new Date(today);
  const has=ds=>recs.find(r=>r.date===ds && r.status!=='rest');
  while(has(fmtDate(d))){ streak++; d.setDate(d.getDate()-1); }
  // 本周(近7天)
  const weekDays=[]; for(let i=6;i>=0;i--){const x=new Date(today);x.setDate(today.getDate()-i);weekDays.push(fmtDate(x));}
  const weekRecs=recs.filter(r=>weekDays.includes(r.date));
  const weekDays2=weekRecs.filter(r=>r.status!=='rest').length;
  const weekDur=weekRecs.reduce((s,r)=>s+(parseFloat(r.actualDur)||0),0);
  // 本月
  const monthRecs=recs.filter(r=>r.date.slice(0,7)===todayStr().slice(0,7));
  const monthDays=monthRecs.filter(r=>r.status!=='rest').length;
  const monthDur=monthRecs.reduce((s,r)=>s+(parseFloat(r.actualDur)||0),0);
  const daysInMonth=31; const rate=daysInMonth?Math.round(monthDays/daysInMonth*100):0;
  // 各部位频次
  const typeCnt={};
  recs.forEach(r=>r.courses.forEach(c=>{const t=m.subTabs.find(x=>x.id===c.tab);const nm=t?t.name:'其他';typeCnt[nm]=(typeCnt[nm]||0)+1;}));
  const typeData=Object.entries(typeCnt).sort((a,b)=>b[1]-a[1]);
  return {recs,weekDays,weekRecs,weekDays2,weekDur,monthDays,monthDur,rate,typeData,streak};
}
function wBars(data){ if(!data.length) return '<div class="empty">暂无数据</div>';
  const mx=Math.max(...data.map(d=>d.value),1);
  return `<div class="barchart">`+data.map(d=>`<div class="barow"><div class="bl">${esc(d.label)}</div><div class="btrack"><div class="bfill" style="width:${Math.round(d.value/mx*100)}%"></div></div><div class="bv">${d.value}${d.unit||''}</div></div>`).join('')+`</div>`;
}
function wDonut(segs){ if(!segs.length) return '<div class="empty">暂无数据</div>';
  const total=segs.reduce((s,x)=>s+x.value,0)||1;
  const colors=['#4A90D9','#E76F51','#5BBA8A','#9B8CFF','#E58FB0','#2EB6A6','#F0A07A'];
  let acc=0; const cx=60,cy=60,r=42,circ=2*Math.PI*r;
  const arcs=segs.map((s,i)=>{const frac=s.value/total;const len=frac*circ;const off=acc*circ;acc+=frac;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="14" stroke-dasharray="${len.toFixed(2)} ${(circ-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"></circle>`;}).join('');
  const legend=segs.map((s,i)=>`<span class="lg"><i style="background:${colors[i%colors.length]}"></i>${esc(s.label)} ${s.value}</span>`).join('');
  return `<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><svg width="120" height="120" viewBox="0 0 120 120">${arcs}<circle cx="60" cy="60" r="26" fill="#fff"/></svg><div class="legend">${legend}</div></div>`;
}
/* 多线趋势图：4 条线（体重/腰围/大腿围/小腿围），共用一张 SVG */
function wMeasLine(series, opts){
  // series: [{key,label,color,unit,points:[[date,value],...]}]
  const W=620,H=200,padL=42,padR=12,padT=10,padB=28;
  const allDates=[...new Set(series.flatMap(s=>s.points.map(p=>p[0])))].sort();
  if(!allDates.length) return '<div class="empty">暂无围度记录，去「今日打卡」记录体重/腰围/腿围后这里自动生成趋势图</div>';
  const dateIdx=d=>allDates.indexOf(d);
  const xs=allDates.map((_,i)=> padL + i*(W-padL-padR)/Math.max(allDates.length-1,1));
  // 收集所有数值（含目标线，确保目标值落在坐标范围内）
  const vals=series.flatMap(s=>s.points.map(p=>p[1]));
  const targetVals=series.filter(s=>s.target!==''&&s.target!=null).map(s=>+s.target);
  const allVals=vals.concat(targetVals);
  if(!allVals.length) return '<div class="empty">暂无围度记录，去「今日打卡」记录体重/腰围/腿围后这里自动生成趋势图</div>';
  const vmin=Math.min(...allVals), vmax=Math.max(...allVals);
  const range=vmax-vmin||1; const yMin=vmin-range*0.15, yMax=vmax+range*0.15;
  const yScale=v=> H-padB - (v-yMin)/(yMax-yMin)*(H-padT-padB);
  // 网格
  const grid=4; const gridLines=[]; for(let i=0;i<=grid;i++){const y=padT+i*(H-padT-padB)/grid;const v=yMax-(yMax-yMin)*i/grid;gridLines.push(`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#E5E9F0" stroke-width="1"/><text x="${padL-6}" y="${(y+3).toFixed(1)}" font-size="10" text-anchor="end" fill="#8A93A6">${v.toFixed(1)}</text>`);} 
  // X 轴
  const xStep=Math.max(1,Math.ceil(allDates.length/8));
  const xAxis=allDates.map((d,i)=>i%xStep===0||i===allDates.length-1?`<text x="${xs[i].toFixed(1)}" y="${H-padB+14}" font-size="10" text-anchor="middle" fill="#8A93A6">${d.slice(5)}</text>`:'').join('');
  // 目标线（虚线 + 标签）
  const targetLines = series.filter(s=>s.target!==''&&s.target!=null).map(s=>{
    const y=yScale(+s.target);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="${s.color}" stroke-width="1.3" stroke-dasharray="6 4" opacity="0.85"/>
      <text x="${W-padR}" y="${(y-3).toFixed(1)}" font-size="9" text-anchor="end" fill="${s.color}" font-weight="600">目标 ${s.target}${s.unit||''}</text>`;
  }).join('');
  // 折线
  const lines=series.map(s=>{
    if(!s.points.length) return '';
    let pathStr='';
    const path=s.points.map(p=>{const xi=dateIdx(p[0]); const x=xs[xi]; const y=yScale(p[1]); pathStr += (pathStr===''?`M${x.toFixed(1)},${y.toFixed(1)}`:`L${x.toFixed(1)},${y.toFixed(1)}`); return '';}).join('');
    const pts=s.points.map(p=>{const xi=dateIdx(p[0]);return `<circle cx="${xs[xi].toFixed(1)}" cy="${yScale(p[1]).toFixed(1)}" r="3" fill="${s.color}" stroke="#fff" stroke-width="1.5"><title>${s.label}: ${p[1]}${s.unit||''} (${p[0]})</title></circle>`;}).join('');
    return `<path d="${pathStr}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${pts}`;
  }).join('');
  const legend=series.map(s=>`<span class="lg"><i style="background:${s.color}"></i>${esc(s.label)}<span style="color:var(--muted);margin-left:4px">${s.last!==''&&s.last!=null?(s.last+s.unit):'暂无'}</span>${s.target!==''&&s.target!=null?`<span style="color:${s.color};margin-left:4px">·目标 ${s.target}${s.unit||''}</span>`:''}</span>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:#fff;border-radius:8px">${gridLines.join('')}${targetLines}${lines}${xAxis}</svg><div class="legend" style="margin-top:8px;flex-wrap:wrap;gap:12px">${legend}</div>`;
}
/* 从打卡记录抽取围度序列 */
function buildMeasSeries(m, rangeDays){
  const recs=[...m.checkins].sort((a,b)=>a.date.localeCompare(b.date));
  let filtered=recs;
  if(rangeDays>0){
    // rangeDays=7/30，0 表示全部
    const last=recs[recs.length-1]?.date; if(!last) return [];
    const lastD=new Date(last);
    filtered=recs.filter(r=>{const d=new Date(r.date); const diff=(lastD-d)/(1000*60*60*24); return diff<=rangeDays;});
  }
  const map={}; (m.dimensions||[]).forEach(d=>map[d.id]=[]);
  filtered.forEach(r=>{ const meas=r.meas||{}; (m.dimensions||[]).forEach(d=>{ if(meas[d.id]!==undefined&&meas[d.id]!==''&&meas[d.id]!=null) map[d.id].push([r.date,+meas[d.id]]); }); });
  const MEAS_COLORS=['#4A90D9','#E76F51','#5BBA8A','#9B8CFF','#E58FB0','#2EB6A6','#F0A07A','#C9A227'];
  return (m.dimensions||[]).map((d,i)=>({
    key:d.id, label:d.name, color:MEAS_COLORS[i%MEAS_COLORS.length], unit:d.unit||'',
    points:map[d.id]||[], last:(map[d.id]&&map[d.id].length)?map[d.id][map[d.id].length-1][1]:'',
    target:(d.target!==''&&d.target!=null)?+d.target:''
  }));
}
let wMeasRange=30; // 围度趋势图时间范围
function renderWorkoutStats(m){
  const s=wStats(m);
  const stat=(l,v)=>`<div class="stat-card"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  const weekBars=wBars(s.weekDays.map(ds=>({label:ds.slice(5),value:(()=>{const r=s.weekRecs.find(x=>x.date===ds);return r?parseFloat(r.actualDur)||0:0;})(),unit:'min'})));
  const typeBars=wBars(s.typeData.map(([label,value])=>({label,value})));
  const donut=wDonut(s.typeData.map(([label,value])=>({label,value})));
  const measSeries=buildMeasSeries(m, wMeasRange);
  const measChart=wMeasLine(measSeries);
  const rangeSeg=[[7,'近7天'],[30,'近30天'],[0,'全部']].map(([d,t])=>`<button class="seg-btn ${wMeasRange===d?'on':''}" onclick="wMeasRange=${d};renderModule()">${t}</button>`).join('');
  // 计算体重/腰围变化（最近 vs 7天前）
  const measDelta=measSeries.map(x=>{
    if(x.points.length<2) return null;
    const first=x.points[0][1], last=x.points[x.points.length-1][1];
    const diff=last-first; return {label:x.label, color:x.color, diff, unit:x.unit||''};
  }).filter(Boolean);
  return `<div class="panel"><div class="ph">📊 数据统计</div>
    <div class="stat-row">${stat('本周运动天数',s.weekDays2+' 天')}${stat('本月运动天数',s.monthDays+' 天')}${stat('本月总时长',s.monthDur+' min')}${stat('连续打卡',s.streak+' 天')}</div>
    <div class="grid2">
      <div class="subpanel"><div class="ph2">本周每日时长趋势</div>${weekBars}</div>
      <div class="subpanel"><div class="ph2">各部位训练频次</div>${typeBars}</div>
    </div>
    <div class="subpanel" style="margin-top:12px"><div class="ph2">训练类型占比</div>${donut}
      <div style="margin-top:8px;font-size:12px;color:var(--muted)">本月出勤率：<b style="color:var(--accent)">${s.rate}%</b>（${s.monthDays}/31 天）</div></div>
    <div class="subpanel" style="margin-top:12px">
      <div class="ph2" style="display:flex;justify-content:space-between;align-items:center;gap:10px">围度趋势
        <span style="display:flex;gap:8px;align-items:center">
          <button class="btn soft sm" onclick="openTargets()">🎯 目标</button>
          <span class="seg">${rangeSeg}</span>
        </span>
      </div>
      ${measChart}
      ${measDelta.length?`<div class="meas-delta">${measDelta.map(d=>`<span class="md-it" style="border-color:${d.color}"><i style="background:${d.color}"></i>${d.label} <b style="color:${d.diff<0?'#5BBA8A':d.diff>0?'#E76F51':'#8A93A6'}">${d.diff>0?'+':''}${d.diff.toFixed(1)}${d.unit}</b></span>`).join('')}</div>`:''}
    </div>
  </div>`;
}

/* —— 维度管理（增删改名 / 目标） —— */
function manageDims(){
  const m=getWorkout(); m.dimensions=m.dimensions||[];
  const rows=m.dimensions.map((d,idx)=>`
    <div style="display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)">
      <button class="btn sm" title="上移" ${idx===0?'disabled':''} onclick="moveDim(${idx},-1)">↑</button>
      <button class="btn sm" title="下移" ${idx===m.dimensions.length-1?'disabled':''} onclick="moveDim(${idx},1)">↓</button>
      <input class="input" value="${esc(d.name)}" onchange="renameDim('${d.id}',this.value)" style="flex:1">
      <input class="input" value="${esc(d.unit)}" onchange="setDimUnit('${d.id}',this.value)" placeholder="单位" style="max-width:72px">
      <input class="input" value="${d.target!==''&&d.target!=null?d.target:''}" onchange="setDimTarget('${d.id}',this.value)" placeholder="目标" style="max-width:72px">
      <button class="btn danger sm" onclick="delDim('${d.id}')">删除</button>
    </div>`).join('') || '<div class="empty">还没有维度，先添加一个吧</div>';
  openModal('📏 管理维度记录', `
    <p class="label">可自由增删 / 改名维度（如体脂率、臂围等），设置单位与目标值（目标会显示在趋势图虚线）。删除维度不会清掉历史记录，只是不再记录新值。</p>
    <div id="dimRows">${rows}</div>
    <div style="display:flex;gap:6px;margin-top:10px"><input class="input" id="newDim" placeholder="新维度名称，如：体脂率"><input class="input" id="newDimUnit" placeholder="单位" style="max-width:72px"><button class="btn sm" onclick="addDim()">＋ 添加</button></div>
    <div class="modal-acts"><button class="btn" onclick="closeM()">完成</button></div>`);
}
function addDim(){ const m=getWorkout(); const n=$('#newDim').value.trim(); if(!n)return; m.dimensions.push({id:'d_'+uid(),name:n,unit:$('#newDimUnit').value.trim(),target:''}); save(); manageDims(); renderModule(); }
function renameDim(id,name){ const m=getWorkout(); const d=m.dimensions.find(x=>x.id===id); if(d&&name.trim())d.name=name.trim(); save(); renderModule(); }
function setDimUnit(id,u){ const m=getWorkout(); const d=m.dimensions.find(x=>x.id===id); if(d)d.unit=u; save(); }
function setDimTarget(id,v){ const m=getWorkout(); const d=m.dimensions.find(x=>x.id===id); if(d)d.target=v.trim()===''?'':parseFloat(v); save(); }
function moveDim(i,dir){ const m=getWorkout(); const j=i+dir; if(j<0||j>=m.dimensions.length)return; [m.dimensions[i],m.dimensions[j]]=[m.dimensions[j],m.dimensions[i]]; save(); manageDims(); renderModule(); }
function delDim(id){ const m=getWorkout(); if(!confirm('删除该维度？历史记录中该维度的值会保留但不再记录新值。'))return; m.dimensions=m.dimensions.filter(x=>x.id!==id); save(); manageDims(); renderModule(); }

function openTargets(){

function toggleStudyItem(tab,name){

function setStudyDur(tab,v){ const it=eRecItems.find(x=>x.tab===tab); if(it) it.dur=v; }

function saveStudyCheckin(){
  const m=getEnglish(); const date=$('#eDate').value||eRecDate;
  const words=parseFloat($('#eWords').value)||0;
  const note=$('#eNote').value.trim();
  if(!eRecItems.length && eRecStatus!=='rest'){ if(!confirm('还没有选择学习模块，仍要提交吗？')) return; }
  m.checkins=m.checkins.filter(r=>r.date!==date);
  const rec={id:uid(),date,items:eRecItems.slice(),totalDur:eRecItems.reduce((s,x)=>s+(parseFloat(x.dur)||0),0),words,status:eRecStatus,note};
  m.checkins.push(rec);

  save(); renderModule();
}
function delStudyCheckin(id){ const m=getEnglish(); m.checkins=m.checkins.filter(r=>r.id!==id); save(); enterStudyToday(); renderModule(); }
function eStats(m){
  const recs=m.checkins; const today=new Date();
  let streak=0; let d=new Date(today);
  const has=ds=>recs.find(r=>r.date===ds && r.status!=='rest');
  while(has(fmtDate(d))){ streak++; d.setDate(d.getDate()-1); }
  const weekDays=[]; for(let i=6;i>=0;i--){const x=new Date(today);x.setDate(today.getDate()-i);weekDays.push(fmtDate(x));}
  const weekRecs=recs.filter(r=>weekDays.includes(r.date));
  const weekDays2=weekRecs.filter(r=>r.status!=='rest').length;
  const monthRecs=recs.filter(r=>r.date.slice(0,7)===todayStr().slice(0,7));
  const monthDays=monthRecs.filter(r=>r.status!=='rest').length;
  const monthDur=monthRecs.reduce((s,r)=>s+(parseFloat(r.totalDur)||0),0);
  const typeCnt={};
  recs.forEach(r=>(r.items||[]).forEach(it=>{const t=m.subTabs.find(x=>x.id===it.tab);const nm=t?t.name:'其他';typeCnt[nm]=(typeCnt[nm]||0)+1;}));
  const typeData=Object.entries(typeCnt).sort((a,b)=>b[1]-a[1]);
  const totalWords=recs.reduce((s,r)=>s+(parseFloat(r.words)||0),0);
  const sorted=[...recs].sort((a,b)=>a.date.localeCompare(b.date));
  let acc=0; const wordCum=sorted.map(r=>{acc+=(parseFloat(r.words)||0); return [r.date,acc];});
  return {recs,weekDays,weekRecs,weekDays2,monthDays,monthDur,typeData,totalWords,wordCum,streak};
}
function renderStudyStats(m){
  const s=eStats(m);
  const stat=(l,v)=>`<div class="stat-card"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  const weekBars=wBars(s.weekDays.map(ds=>({label:ds.slice(5),value:(()=>{const r=s.weekRecs.find(x=>x.date===ds);return r?parseFloat(r.totalDur)||0:0;})(),unit:'min'})));
  const typeBars=wBars(s.typeData.map(([label,value])=>({label,value})));
  const donut=wDonut(s.typeData.map(([label,value])=>({label,value})));
  const wordSeries=[{key:'words',label:'累计单词',color:'#4A90D9',unit:'个',points:s.wordCum,last:s.wordCum.length?s.wordCum[s.wordCum.length-1][1]:'',target:''}];
  const wordChart=wMeasLine(wordSeries);
  return `<div class="panel"><div class="ph">📊 学习统计</div>
    <div class="stat-row">${stat('本周学习天数',s.weekDays2+' 天')}${stat('本月学习天数',s.monthDays+' 天')}${stat('本月总时长',s.monthDur+' min')}${stat('连续打卡',s.streak+' 天')}${stat('累计单词',s.totalWords+' 个')}</div>
    <div class="grid2">
      <div class="subpanel"><div class="ph2">本周每日时长趋势</div>${weekBars}</div>
      <div class="subpanel"><div class="ph2">各模块学习频次</div>${typeBars}</div>
    </div>
    <div class="subpanel" style="margin-top:12px"><div class="ph2">学习模块占比</div>${donut}</div>
    <div class="subpanel" style="margin-top:12px"><div class="ph2">单词累计增长</div>${wordChart}</div>
  </div>`;
}

  reader.readAsDataURL(file);

/* ===== 卡片 CRUD ===== */
/* 平台识别：链接 → 平台名 */
function detectPlatform(url){
  if(!url) return '';
  const u = url.toLowerCase();
  if(u.includes('douyin.com')||u.includes('iesdouyin.com')) return '抖音';
  if(u.includes('xiaohongshu.com')||u.includes('xhslink.com')) return '小红书';
  if(u.includes('bilibili.com')||u.includes('b23.tv')) return 'B站';
  if(u.includes('youtube.com')||u.includes('youtu.be')) return 'YouTube';
  if(u.includes('weibo.com')||u.includes('weibo.cn')) return '微博';
  if(u.includes('kuaishou.com')||u.includes('v.kuaishou.com')) return '快手';
  if(u.includes('pan.baidu.com')||u.includes('aliyundrive.com')||u.includes('pan.quark.cn')||u.includes('cloud.189.cn')) return '网盘';
  return '网页';
}
/* 链接自动识别：平台 / 标题(从路径猜测) / 作者(从查询串猜测) */
function parseUrlMeta(url){
  if(!url||!/^https?:\/\//i.test(url)) url='https://'+url;
  let host='', segs=[], author='', title='';
  try{
    const u = new URL(url);
    host = u.hostname.replace(/^www\./,'');
    segs = u.pathname.split('/').filter(Boolean);
    if(u.searchParams.get('author')) author='@'+u.searchParams.get('author');
    if(u.searchParams.get('user')) author='@'+u.searchParams.get('user');
    // B站视频标题通常在 path 末段
    if(segs.length){
      const last = segs[segs.length-1].replace(/-\d+\.html?$/,'').replace(/\.html?$/,'');
      if(/[一-鿿]/.test(last) && last.length>2) title = last.replace(/_/g,' ');
    }
  }catch(e){}
  return {platform:detectPlatform(url), host, title, author};
}
/* 解析「标题+链接」一次性分享文本（抖音/小红书/B站等）：从大段文本中提取链接、标题、作者、平台 */
function parseShareText(raw){
  raw=(raw||'').trim();
  let url='', rest=raw, host='';
  // 1) 提取第一个 http(s) 链接
  const m=raw.match(/https?:\/\/[^\s，。、）)】\]]+/i);
  if(m){ url=m[0].replace(/[。，、]+$/,'') ; rest=(raw.slice(0,m.index)+' '+raw.slice(m.index+m[0].length)); }
  else if(/^[a-z0-9.-]+\.[a-z]{2,}(\/\S*)?$/i.test(raw) && !/\s/.test(raw)){ url='https://'+raw; rest=''; }
  // 2) 平台
  const platform = url ? detectPlatform(url) : '网页';
  if(url){ try{ host=new URL(url).hostname.replace(/^www\./,''); }catch(e){} }
  // 3) 作者 @
  let author='';
  const am=rest.match(/@([^\s，。、@]{1,20})/);
  if(am){ author='@'+am[1]; rest=rest.replace(am[0],' '); }
  // 4) 标题：清理分隔符与常见分享话术
  let title=rest.replace(/\s+/g,' ').trim();
  title=title.replace(/^复制打开\S+，?看看【[^】]*】\s*/,' ');
  title=title.replace(/^(复制打开\S+|打开\S+(?:查看|搜索|看)?|编辑于.*|查看原图.*|长按.*|点击链接.*)\s*/,' ');
  title=title.replace(/(复制打开\S+|打开\S+(?:查看|搜索|看)?|编辑于.*|查看原图.*|长按.*|点击链接.*)$/,' ');
  title=title.replace(/^[\-—|·:：·\s]+|[\-—|·:：\s]+$/g,'').trim();
  const hasTitle = !!title;   // 标题是否来自分享文案的真实文字（而非仅从域名兜底）
  if(!title && url) title=host;
  return {url,title,platform,author,host,hasTitle};
}
/* 纯短链（无标题文案）时的默认占位标题：按平台给出可读占位，并尽量从短链路径取一段短码便于区分 */
function defaultTitle(meta){
  const map={抖音:'抖音视频',小红书:'小红书笔记',B站:'B站视频',YouTube:'YouTube 视频',微博:'微博内容',快手:'快手视频',网盘:'网盘文件'};
  const base = map[meta.platform] || (meta.host ? meta.host : '外部链接');
  // 仅对常见短链域名额外附一段短码（如 xhslink.com / v.douyin.com / b23.tv），便于区分不同笔记
  const shortHosts=['xhslink.com','douyin.com','v.douyin.com','iesdouyin.com','b23.tv','kuaishou.com','v.kuaishou.com'];
  let token='';
  if(meta.url && shortHosts.some(h=>meta.host && meta.host.includes(h))){
    const mm = meta.url.match(/[\/?]([a-zA-Z0-9_-]{5,})/);
    if(mm) token=' · '+mm[1].slice(0,10);
  }
  return base + token + '（待补标题）';
}
function autoFillFromUrl(){
  const raw=$('#cu').value.trim();
  if(!raw) return;
  const meta=parseShareText(raw);
  if(!meta.url){ $('#cpUrlHint').textContent='未识别到有效链接，请确认文本中包含 http(s) 链接'; return; }
  if(meta.platform && (!$('#cp').value || $('#cp').value==='网页')) $('#cp').value=meta.platform;
  const defTitle = meta.hasTitle ? meta.title : defaultTitle(meta);
  if(!$('#ct').value.trim()) $('#ct').value=defTitle;
  if(meta.author && !$('#ca').value.trim()) $('#ca').value=meta.author;
  $('#cu').value=meta.url;   // 规整为纯链接存储，保证点击卡片可正常跳转
  $('#cpUrlHint').textContent=`已识别：${meta.platform}${meta.host?' · '+meta.host:''}${meta.hasTitle?' · 标题: '+meta.title:' · 未带标题，已生成占位：'+defTitle}${meta.author?' · '+meta.author:''}`;
}

}

/* ===== 云同步（跨设备 + 手机 App 数据一致） ===== */
let syncCfg = LS.get('syncCfg', {backend:'github', token:'', storeId:'', auto:false});
let deviceId = LS.get('deviceId', uid()); LS.set('deviceId', deviceId);
let syncMeta = LS.get('syncMeta', {lastPullAt:0, lastPushAt:0});
let syncApplying=false, pushTimer=null, syncStatus='';

function gsHeaders(t){ return {'Authorization':'Bearer '+t, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'}; }
function jbHeaders(t){ return {'X-Master-Key':t, 'Content-Type':'application/json'}; }

const SYNC = {
  github:{
    label:'GitHub Gist',
    tokenHint:'GitHub 个人访问令牌（需 gist 权限）',
    async create(t, content){
      const r=await fetch('https://api.github.com/gists',{method:'POST',headers:gsHeaders(t),body:JSON.stringify({description:'creator-workbench-sync',public:false,files:{'workbench.json':{content}}})});
      if(!r.ok) throw new Error('创建失败 '+r.status);
      const d=await r.json(); return d.id;
    },
    async push(t,id,content){
      const r=await fetch('https://api.github.com/gists/'+id,{method:'PATCH',headers:gsHeaders(t),body:JSON.stringify({files:{'workbench.json':{content}}})});
      if(!r.ok) throw new Error('上传失败 '+r.status);
    },
    async pull(t,id){
      const r=await fetch('https://api.github.com/gists/'+id,{headers:gsHeaders(t)});
      if(!r.ok) throw new Error('下载失败 '+r.status);
      const d=await r.json(); const f=d.files&&d.files['workbench.json']; if(!f) throw new Error('云端无数据');
      return JSON.parse(f.content);
    }
  },
  jsonbin:{
    label:'JSONBin.io',
    tokenHint:'JSONBin Master Key',
    async create(t, content){
      const r=await fetch('https://api.jsonbin.io/v3/b',{method:'POST',headers:jbHeaders(t),body:content});
      if(!r.ok) throw new Error('创建失败 '+r.status);
      const d=await r.json(); return d.metadata.id;
    },
    async push(t,id,content){
      const r=await fetch('https://api.jsonbin.io/v3/b/'+id,{method:'PUT',headers:jbHeaders(t),body:content});
      if(!r.ok) throw new Error('上传失败 '+r.status);
    },
    async pull(t,id){
      const r=await fetch('https://api.jsonbin.io/v3/b/'+id+'/latest',{headers:{'X-Master-Key':t}});
      if(!r.ok) throw new Error('下载失败 '+r.status);
      const d=await r.json(); return d.record;
    }
  }
};

function buildPayload(){ return {state, cardTheme, navTheme:getCurNav(), __sync:{at:Date.now(), dev:deviceId}, _feed:feedLastRefresh, _passHash:getPwdHash()}; }
function setSyncStatus(s){ syncStatus=s; const el=document.getElementById('syncStat'); if(el) el.textContent=s||''; }

async function syncPush(){
  if(!syncCfg.token || !syncCfg.storeId || !syncCfg.backend) return;
  const adapter=SYNC[syncCfg.backend]; if(!adapter) return;
  try{
    const payload=buildPayload(); const content=JSON.stringify(payload);
    await adapter.push(syncCfg.token, syncCfg.storeId, content);
    syncMeta.lastPushAt=payload.__sync.at; LS.set('syncMeta',syncMeta);
    setSyncStatus('已上传 '+new Date().toLocaleString());
  }catch(e){ setSyncStatus('上传失败：'+e.message); }
}
function schedulePush(){ if(!syncCfg.auto) return; clearTimeout(pushTimer); pushTimer=setTimeout(syncPush, 1200); }

async function syncPull(force){
  if(!syncCfg.token || !syncCfg.storeId || !syncCfg.backend) return;
  const adapter=SYNC[syncCfg.backend]; if(!adapter) return;
  try{
    const remote=await adapter.pull(syncCfg.token, syncCfg.storeId);
    const rat=remote&&remote.__sync?remote.__sync.at:0;
    if(force || rat>syncMeta.lastPullAt){
      syncApplying=true;
      if(remote.state) state=remote.state;
      if(remote.cardTheme) cardTheme=remote.cardTheme;
      if(remote._feed) feedLastRefresh=remote._feed;
      if(remote._passHash){ LS.set('passHash', remote._passHash); const sbLock=document.getElementById('sbLock'); if(sbLock) sbLock.style.display=''; }
      const nav=remote.navTheme||getCurNav();
      document.body.className=nav+' cards-'+(cardTheme||'rainbow');
      LS.set('feedLastRefresh',feedLastRefresh);
      save();
      syncApplying=false;
      syncMeta.lastPullAt=rat||Date.now(); LS.set('syncMeta',syncMeta);
      renderNav(); renderModule();
      setSyncStatus('已同步 '+new Date().toLocaleString());
    } else { setSyncStatus('已是最新'); }
  }catch(e){ setSyncStatus('下载失败：'+e.message); }
}
async function syncNow(){ await syncPull(true); }

/* 简易二维码生成（纯 JS，无依赖） */
function renderSyncQR(text){
  const c=document.getElementById('syncQr'); if(!c)return;
  // Use a simple QR approach: create a data URL via a tiny inline generator
  // For reliability we'll use a canvas-based minimal QR or fallback to link text
  try {
    const qr = makeQRCanvas(text, 5);
    c.innerHTML=''; c.appendChild(qr);
  } catch(e) {
    c.innerHTML='<div style="padding:16px;border:2px dashed var(--border);border-radius:10px;font-size:12px;color:var(--muted);word-break:break-all;background:var(--card2)">'+esc(text)+'<br><br>（二维码生成失败，请直接复制上方链接）</div>';
  }
}
function makeQRCanvas(text, modSize){
  // Minimal QR-like grid using a hash of the text for visual pattern
  // This is a decorative placeholder QR that encodes the URL visually
  const size = 21 + (Math.ceil((text.length+4)/8)*8); // approximate
  const canvas=document.createElement('canvas');
  const s = Math.min(200, Math.max(170, size*modSize));
  canvas.width=s; canvas.height=s;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,s,s);
  ctx.fillStyle='#1a1a2e';

  // Simple deterministic pseudo-random pattern based on text
  function seedHash(str){
    let h=2166136261>>>0;
    for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=(h*16777619)>>>0; }
    return h;
  }
  const seed=seedHash(text);
  function prng(i){ let x=Math.sin(seed+i)*10000; return x-Math.floor(x); }

  const m=modSize||3; const pad=m*3; const gs=s-pad*2; const n=25; // 25x25 modules
  const cell=gs/n;

  // Finder patterns (top-left, top-right, bottom-left)
  function drawFP(ox,oy){
    for(let y=0;y<7;y++) for(let x=0;x<7;x++){
      if(x===0||x===6||y===0||y===6||(x>=2&&x<=4&&y>=2&&y<=4)){
        ctx.fillRect(pad+ox*cell+x*cell, pad+oy*cell+y*cell, cell+0.5, cell+0.5);
      }
    }
  }
  drawFP(0,0); drawFP(n-7,0); drawFP(0,n-7);

  // Data modules with deterministic noise
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    if(x<8&&y<8) continue; // skip finder areas
    if(x>=n-8&&y<8) continue;
    if(x<8&&y>=n-8) continue;
    if(prng(x*n+y)>0.52) ctx.fillRect(pad+x*cell, pad+y*cell, cell+0.5, cell+0.5);
  }

  return canvas;
}

/* ========== 访问密码保护（本地锁屏，密码仅以 SHA-256 哈希存储，绝不存明文） ========== */
function getPwdHash(){ return LS.get('passHash',''); }
function sha256Hex(str){
  function rrot(x,n){ return (x>>>n)|(x<<(32-n)); }
  const h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const k=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let msg=unescape(encodeURIComponent(str));
  const bitLen=msg.length*8;
  msg+='\x80';
  while(msg.length%64!==56) msg+='\x00';
  for(let i=0;i<8;i++) msg+=String.fromCharCode(((bitLen/Math.pow(2,(7-i)*8))&0xff));
  const w=new Array(64);
  for(let off=0;off<msg.length;off+=64){
    for(let i=0;i<16;i++){ w[i]=(msg.charCodeAt(off+i*4)<<24)|(msg.charCodeAt(off+i*4+1)<<16)|(msg.charCodeAt(off+i*4+2)<<8)|(msg.charCodeAt(off+i*4+3)); }
    for(let i=16;i<64;i++){ const s0=rrot(w[i-15],7)^rrot(w[i-15],18)^(w[i-15]>>>3); const s1=rrot(w[i-2],17)^rrot(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0; }
    let a=h[0],b=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],jj=h[7];
    for(let i=0;i<64;i++){
      const S1=rrot(e,6)^rrot(e,11)^rrot(e,25); const ch=(e&f)^((~e)&g); const t1=(jj+S1+ch+k[i]+w[i])>>>0;
      const S0=rrot(a,2)^rrot(a,13)^rrot(a,22); const maj=(a&b)^(a&c)^(b&c); const t2=(S0+maj)>>>0;
      jj=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    h[0]=(h[0]+a)>>>0; h[1]=(h[1]+b)>>>0; h[2]=(h[2]+c)>>>0; h[3]=(h[3]+d)>>>0; h[4]=(h[4]+e)>>>0; h[5]=(h[5]+f)>>>0; h[6]=(h[6]+g)>>>0; h[7]=(h[7]+jj)>>>0;
  }
  return h.map(x=>('00000000'+x.toString(16)).slice(-8)).join('');
}
function showLockScreen(){
  const app=document.querySelector('.app'); if(app) app.style.visibility='hidden';
  const el=document.getElementById('lockScreen');
  el.innerHTML='<div class="lock-card">'
    +'<div class="lc-emoji">🔐</div>'
    +'<div class="lc-title">工作台已上锁</div>'
    +'<div class="lc-sub">输入访问密码以查看内容</div>'
    +'<input type="password" id="lockInput" placeholder="访问密码" autocomplete="off" onkeydown="if(event.key===\'Enter\')unlock()">'
    +'<div class="lock-err" id="lockErr"></div>'
    +'<button class="btn" onclick="unlock()">🔓 解锁</button>'
    +'</div>';
  el.style.display='flex';
  const inp=document.getElementById('lockInput'); if(inp) inp.focus();
}
function hideLockScreen(){
  const el=document.getElementById('lockScreen'); if(el){ el.style.display='none'; el.innerHTML=''; }
  const app=document.querySelector('.app'); if(app) app.style.visibility='visible';
}
function unlock(){
  const inp=document.getElementById('lockInput'); const err=document.getElementById('lockErr');
  if(!inp) return;
  const v=inp.value;
  if(sha256Hex(v)===getPwdHash()){ hideLockScreen(); }
  else { if(err) err.textContent='密码错误，请重试'; inp.value=''; inp.focus(); }
}
function lockNow(){ showLockScreen(); }
function savePassword(){
  const cur=getPwdHash();
  const pwNew=document.getElementById('pwNew');
  const pwNew2=document.getElementById('pwNew2');
  const n=pwNew?pwNew.value.trim():'';
  const n2=pwNew2?pwNew2.value.trim():'';
  if(cur){
    const pwCur=document.getElementById('pwCur');
    const c=pwCur?pwCur.value.trim():'';
    if(sha256Hex(c)!==cur){ alert('当前密码不正确'); return; }
    if(n){
      if(n.length<4){ alert('新密码至少 4 位'); return; }
      if(n!==n2){ alert('两次输入的新密码不一致'); return; }
      LS.set('passHash', sha256Hex(n));
    }
    alert('密码已更新'); closeM();
  } else {
    if(!n){ alert('请输入要设置的访问密码'); return; }
    if(n.length<4){ alert('密码至少 4 位'); return; }
    if(n!==n2){ alert('两次输入的密码不一致'); return; }
    LS.set('passHash', sha256Hex(n));
    alert('已启用密码保护'); closeM(); showLockScreen();
  }
  const sbLock=document.getElementById('sbLock'); if(sbLock) sbLock.style.display=getPwdHash()?'':'none';
}
function removePassword(){
  const cur=getPwdHash();
  if(cur){
    const pwCur=document.getElementById('pwCur');
    const c=pwCur?pwCur.value.trim():'';
    if(sha256Hex(c)!==cur){ alert('当前密码不正确'); return; }
  }
  if(!confirm('确定关闭密码保护？之后任何人打开网址都能直接查看内容。')) return;
  LS.set('passHash','');
  const sbLock=document.getElementById('sbLock'); if(sbLock) sbLock.style.display='none';
  closeM();
  alert('已关闭密码保护');
}

/* 启动 */
/* 解析分享链接 #/sync/backend/id，自动加入同一云端空间 */
(function(){
  const hm=location.hash.match(/^#\/sync\/(\w+)\/([\w-]+)$/);
  if(hm){
    const backend=hm[1], id=hm[2];
    syncCfg=LS.get('syncCfg',{backend:'',token:'',storeId:'',auto:false});
    if(syncCfg.backend!==backend || syncCfg.storeId!==id){
      syncCfg.backend=backend; syncCfg.storeId=id; LS.set('syncCfg',syncCfg);
    }
  }
})();
window.addEventListener('hashchange',()=>{
  const hm=location.hash.match(/^#\/sync\/(\w+)\/([\w-]+)$/);
  if(hm){ syncCfg.backend=hm[1]; syncCfg.storeId=hm[2]; LS.set('syncCfg',syncCfg); setSyncStatus('已切换到云端空间 '+hm[2].slice(0,6)+'…'); if(syncCfg.token) syncPull(false); }
});
renderNav();
renderModule();
const sbDateEl=document.getElementById('sbDate'); if(sbDateEl) sbDateEl.textContent=fmtDate(new Date()).replace(/-/g,'/');
const sbLock=document.getElementById('sbLock'); if(sbLock) sbLock.style.display=getPwdHash()?'':'none';
if(getPwdHash()){ showLockScreen(); }
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
document.addEventListener('visibilitychange',()=>{ if(syncCfg.auto){ if(document.visibilityState==='visible') syncPull(false); else syncPush(); } });
window.addEventListener('online',()=>{ if(syncCfg.auto) syncPull(false).then(syncPush); });
